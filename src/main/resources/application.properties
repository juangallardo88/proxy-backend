spring.application.name=ai-quota-backend

# Railway asigna el puerto en la variable PORT
server.port=${PORT:8080}

# Zona horaria para los reinicios (minuto y día 1 del mes) y el historial diario
app.timezone=${APP_TIMEZONE:America/Bogota}

# Orígenes permitidos por CORS. En producción pon la URL de Vercel, ej:
# CORS_ALLOWED_ORIGINS=https://ai-quota-frontend.vercel.app,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Solo exponemos el health check del actuator
management.endpoints.web.exposure.include=health

# Cierre ordenado al redesplegar
server.shutdown=graceful

logging.level.com.ucc.aiproxy=INFO
